name: Compila ROM NDS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Usiamo direttamente il container ufficiale nativo fornito da devkitPro
    container: devkitpro/devkitarm:latest

    steps:
    - name: Scarica il codice sorgente
      uses: actions/checkout@v4

    - name: Compila il gioco
      run: |
        make

    - name: Salva il file NDS finale
      uses: actions/upload-artifact@v4
      with:
        name: rom-nintendo-ds
        path: |
          *.nds
