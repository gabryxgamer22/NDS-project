name: Build NDS project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget tar xz-utils build-essential
          mkdir -p /opt
          cd /opt
          wget https://github.com/devkitPro/buildscripts/releases/download/devkitpro-pacman/devkitpro-pacman.amd64.deb
          sudo dpkg -i devkitpro-pacman.amd64.deb
          sudo dkp-pacman -Syu --noconfirm
          sudo dkp-pacman -S --needed --noconfirm devkitARM libnds

      - name: Build NDS ROM
        run: |
          make clean
          make
