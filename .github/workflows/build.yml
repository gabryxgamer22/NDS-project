name: Build NDS project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install devkitPro
        run: |
          curl -L --fail --retry 3 \
            -A "Mozilla/5.0" \
            https://apt.devkitpro.org/install-devkitpro-pacman \
            -o /tmp/install-devkitpro-pacman

          chmod +x /tmp/install-devkitpro-pacman
          sudo /tmp/install-devkitpro-pacman

          sudo dkp-pacman -Syu --noconfirm
          sudo dkp-pacman -S --needed --noconfirm devkitARM libnds

      - name: Build NDS ROM
        run: |
          make clean
          make
